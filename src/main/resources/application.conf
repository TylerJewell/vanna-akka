akka.javasdk.dev-mode.http-port = 9012

akka.javasdk {
  agent {
    # Other models can be configured, see https://doc.akka.io/sdk/agents.html#model
    # and https://doc.akka.io/sdk/model-provider-details.html for the reference configurations.
    model-provider = anthropic
    # model-provider = openai
    # model-provider = googleai-gemini

    anthropic {
      model-name = "claude-opus-4-6"
      api-key = ${?ANTHROPIC_API_KEY}
      max-tokens = 2000
    }

    openai {
      model-name = "gpt-4o-mini"
      api-key = ${?OPENAI_API_KEY}
    }

    googleai-gemini {
      model-name = "gemini-2.5-flash"
      api-key = ${?GOOGLE_AI_GEMINI_API_KEY}
    }
  }
}
